      inner_smile: "Smile to your pericardium. Send warm rose-pink light. Feel safe, held"
    - phase: Peak
      activity: "Peak emotional receptivity — be with people who nourish you"
      improvement: "Avoid: conflict, upsetting news, emotional confrontation"
      pulse_position: "Feel for warmth and flow — Pericardium protects the Heart"
      pulse_description: "Qi at peak — most responsive now. Slippery = phlegm misting Heart (confusion, manic behavior)"
      sound_practice: "Full HEE — gentle sigh, not forceful. Feel the chest soften and open"

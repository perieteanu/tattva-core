      pulse_position: "LEFT wrist, Cun (closest to thumb)"
      pulse_description: "Qi arriving from Heart — surface pulse activating. Healthy: clear, moderate, like a clean stream"
      sound_practice: "HAW — same sound as Heart (paired organ). Sit, hands on lower belly center"
      inner_smile: "Bring attention to the navel area. Feel the sorting, separating energy"
    - phase: Rising
      activity: "Drink water to support fluid separation and absorption"
      improvement: "Good for administrative tasks, email processing, tidying"
      pulse_position: "Use index finger, LIGHT touch (Yang organ = surface)"
      pulse_description: "Qi building — pulse clarifying. Rapid = heat (dark urine, burning, mouth ulcers)"
      sound_practice: "Begin soft HAW exhale. Focus vibration below navel, not in chest"
      inner_smile: "Smile to your small intestine. Send warm red-orange light. Clarity entering"
    - phase: Peak
      activity: "Peak discernment — best for evaluating, choosing, filtering"
      improvement: "Avoid: heavy meals now. Light snack at most if hungry"
      pulse_position: "Stay at skin level, feel for smoothness"
      pulse_description: "Qi at peak — clearest now. Wiry = abdominal pain, cramping around the navel"
      sound_practice: "Full HAW — feel it resonate in the lower abdomen. Hands warm the belly"
      inner_smile: "Feel clear discernment replacing confusion. The pure is separated from the impure"
    - phase: Declining
      activity: "Wrap up analytical work — clarity begins to shift"
      improvement: "Urinary issues during this time = SI heat transferring to Bladder"
      pulse_position: "Compare surface vs deep — surface = SI, deep = Heart"
      pulse_description: "Qi declining — pulse gentling. Slippery = dampness (gurgling intestines, unclear urine)"
      sound_practice: "Soften HAW. Feel the belly warm and organized, clear"
      inner_smile: "Let discriminating wisdom settle. Your body knows what to keep and what to release"
    - phase: Exiting
      activity: "Prepare for Bladder — from sorting to storage/release"
      improvement: "Mouth ulcers, restless mind = SI heat (often from Heart fire)"
      pulse_position: "Mirrors Heart's condition at the surface level"
      pulse_description: "Qi exiting to Bladder. SI separates pure from impure — problems show as urinary issues"
      sound_practice: "Silent HAW. Hands rest. Feel internal clarity and organization"
      inner_smile: "Thank your small intestine. Feel sorted, clear. Prepare for Bladder"

  "Bladder":
    - phase: Entering
      activity: "Good for study and memory retention — Bladder meridian runs along spine"
      improvement: "Emotion: fear-related holding. Tissue: bones (via Kidney partner)"
      pulse_position: "LEFT wrist, Chi (closest to elbow)"
      pulse_description: "Qi arriving from Small Intestine — proximal pulse activating. Healthy: moderate, slightly firm"
      sound_practice: "CHOO — (like blowing out a candle). Sit, hands on lower back/kidneys"
      inner_smile: "Bring attention to your lower back, the bladder area in the pelvis"
    - phase: Rising
      activity: "Gentle back stretches, spinal twists support Bladder meridian"

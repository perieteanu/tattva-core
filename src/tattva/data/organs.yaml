      pulse_position: "This position also reflects Ming Men (Gate of Vitality) fire"
      pulse_description: "Qi exiting to Triple Burner. Reflects emotional state — best indicator for stress and mood"
      sound_practice: "Silent HEE. Hands rest open. Feel emotionally warm and protected"
      inner_smile: "Thank your pericardium. Feel safe to feel. Prepare for Triple Burner"


      inner_smile: "Smile to your bladder. Send blue-black warmth to the lower back and pelvis"
    - phase: Peak
      activity: "Memory and learning peak — back/spine most responsive to care"
      improvement: "Avoid: holding urine, sitting too long, cold on lower back"
      pulse_position: "Stay at skin level, most proximal position"
      pulse_description: "Qi at peak — firmest now. Rapid = damp-heat (burning urination, dark/cloudy urine)"
      sound_practice: "Full CHOO — round the lips, feel vibration in lower back and pelvic floor"
      inner_smile: "Feel courage and flow replacing fear or holding. Bladder area glows deep blue"
    - phase: Declining
      activity: "Wind down study — salty snack in moderation supports water element"
      improvement: "Low back pain, sciatica often relates to Bladder Qi stagnation"
      pulse_position: "May be harder to feel — slightly more pressure than other Yang pulses"
      pulse_description: "Qi declining — pulse easing. Weak = Qi deficiency (dribbling, incomplete urination)"
      sound_practice: "Soften CHOO. Sit up slowly. Feel the lower back warm and released"
      inner_smile: "Let the releasing warmth spread through the pelvis. Holding and tension dissolve"
    - phase: Exiting
      activity: "Prepare for Kidney — release tension from the day"
      improvement: "Frequent/urgent urination = Bladder Qi deficiency. Warm the lower body"
      pulse_position: "Compare with deep press (Kidney below) — Bladder is Kidney's Yang partner"
      pulse_description: "Qi exiting to Kidney. Bladder controls water's exit — reflects lower body and back health"
      sound_practice: "Silent CHOO. Hands rest on knees. Lower back feels warm and open"
      inner_smile: "Thank your bladder. Feel released, flowing. Prepare for Kidney"

  "Kidney":
    - phase: Entering
      activity: "Sexual energy peaks — Kidney stores Jing (essence)"
      improvement: "Emotion: fear. Sense: ears/hearing. Tissue: bones, teeth, hair"
      pulse_position: "LEFT wrist, Chi (closest to elbow)"
      pulse_description: "Qi arriving from Bladder — deepest pulse emerging. Healthy: deep but FIRM at bone level"
      sound_practice: "CHOO — same sound as Bladder (paired organ). Sit, hands on lower back over kidneys"
      inner_smile: "Bring attention deep to your kidneys, either side of the spine at waist level"

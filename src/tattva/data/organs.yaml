      inner_smile: "Let the harmonizing settle. The body's thermostat is resetting for sleep"
    - phase: Exiting
      activity: "Prepare for Gallbladder — the body enters deep repair mode"
      improvement: "Difficulty falling asleep at this time = Qi not descending properly"
      pulse_position: "Unique: compare ALL six positions (both wrists) for overall balance"
      pulse_description: "Qi exiting to Gallbladder. Triple Burner is body's thermostat — imbalance = systemic disharmony"
      sound_practice: "Silent HEE. Whole body feels even, warm, ready for rest"
      inner_smile: "Thank your triple burner. Feel unified. Prepare for deep sleep and Gallbladder"

  "Gallbladder":
    - phase: Entering
      activity: "Deep sleep is CRITICAL now — Gallbladder processes and decides"
      improvement: "Emotion: resentment, bitterness. Taste: bitter. Paired with Liver"
      pulse_position: "LEFT wrist, Guan (middle position)"
      pulse_description: "Qi arriving from Triple Burner — surface pulse activating. Healthy: slightly wiry but smooth"

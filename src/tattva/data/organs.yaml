    - phase: Peak
      activity: "Go to sleep now if possible — thermostat is resetting"
      improvement: "Avoid: eating, intense activity, cold exposure, arguments"
      pulse_position: "Not one organ — feel harmony across all three finger positions"
      pulse_description: "Qi at peak — most balanced now. Soggy = dampness in waterways (edema, heavy limbs, fog)"
      sound_practice: "Full HEE — feel it harmonize upper (breath), middle (digestion), lower (elimination)"
      inner_smile: "Feel whole-body harmony. All three spaces balanced. Temperature even throughout"
    - phase: Declining
      activity: "If awake: only calm, dim, quiet activities"
      improvement: "Hot flashes, erratic temperature = Triple Burner disharmony"
      pulse_position: "Lift all three fingers, reposition, re-read: consistency = health"
      pulse_description: "Qi declining — balance shifting. Weak = overall Qi deficiency (fatigue, weak voice, colds)"

      inner_smile: "Smile to your kidneys. Send deep blue-black light. Warmth to the deepest reserves"
    - phase: Peak
      activity: "Peak vitality access — conserve, don't deplete. Quality rest"
      improvement: "Avoid: overexertion, excessive cold, caffeine. Salty taste supports Kidney"
      pulse_position: "Press firmly to the bone, hold, wait for pulse to emerge"
      pulse_description: "Qi at peak — most substantial now. Thin = Yin deficiency (night sweats, hot palms, dry mouth)"
      sound_practice: "Full CHOO — round lips, blow gently. Feel vibration deep in the lower back"
      inner_smile: "Feel gentle wisdom replacing fear. Kidneys glow deep blue. Life force is nourished"
    - phase: Declining
      activity: "Gentle evening routine — bath, warm drink, calm environment"
      improvement: "Tinnitus, hearing loss, weak knees = Kidney essence declining"
      pulse_position: "This pulse may take 30+ seconds to reveal itself. Be patient"
      pulse_description: "Qi declining — still deep. Rapid-thin = Yin deficiency with heat (afternoon fever, malar flush)"
      sound_practice: "Soften CHOO. Sit up, hands on lower back. Feel deep warmth spreading"
      inner_smile: "Let the warmth settle into bone level. Fear dissolves into quiet confidence"
    - phase: Exiting
      activity: "Prepare for Pericardium — from deep reserves to emotional protection"
      improvement: "Gray hair, loose teeth, low libido = Kidney Jing depletion — rest more"
      pulse_position: "Compare with RIGHT Chi (Pericardium/Ming Men) — both reflect root vitality"
      pulse_description: "Qi exiting to Pericardium. Kidney is root of life — if absent: exhaustion at deepest level"
      sound_practice: "Silent CHOO. Hands rest. Feel rooted, deep, warm at your core"
      inner_smile: "Thank your kidneys. Feel the root of your vitality. Prepare for Pericardium"


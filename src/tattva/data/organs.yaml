# TCM organ clock content, extracted verbatim from calc.py on 2026-09-04.
#
# NOT covered by any 2026-07-22 decision. The clock divides the DISC-UP day
# (sunrise->sunset) and the disc-down night into 6 organs x 5 qi phases -- it does
# NOT use the collared 125-mini tattva arcs. Whether it should is recorded as the
# open decision `organ-clock-anchor` in docs-yaml/DECISIONS.yaml.
#
# Phase order is the qi_phases list; each organ has exactly 5 entries per section.

qi_phases: [Entering, Rising, Peak, Declining, Exiting]
organs_day: ["Lung", "Large Intestine", "Stomach", "Spleen", "Heart", "Small Intestine"]
organs_night: ["Bladder", "Kidney", "Pericardium", "Triple Burner", "Gallbladder", "Liver"]

organs:
  "Lung":
    - phase: Entering
      activity: "Prepare: open windows, fresh air. Gentle wake-up"
      improvement: "Emotion: grief/sadness. Sense: nose. Tissue: skin"
      pulse_position: "RIGHT wrist, Cun (closest to thumb)"
      pulse_description: "Qi arriving — pulse may be faint, growing. Healthy: gentle, slightly floating, like a feather landing"
      sound_practice: "SSSS — sit upright, hands on thighs, palms down"
      inner_smile: "Bring attention to your lungs. Feel the space in your chest expanding"
    - phase: Rising
      activity: "Deep breathing exercises, qi gong, morning stretches"
      improvement: "Pungent foods support Lung: ginger tea, scallions, radish"
      pulse_position: "Use index finger, pad flat on skin"
      pulse_description: "Qi building — pulse strengthening. Weak/thin = Qi deficiency (shortness of breath, soft voice)"
      sound_practice: "Begin exhaling SSSS softly (like a snake). Arms rise slowly, palms up"
      inner_smile: "Smile gently to your lungs. Send warmth and light — imagine white/silver light filling them"
    - phase: Peak
      activity: "Best time for meditation and pranayama — Lung Qi at peak"
      improvement: "Avoid: smoking, cold drinks, dairy. Protect from cold drafts"
      pulse_position: "Press DEEP to feel the Lung (Yin organ)"
      pulse_description: "Qi at peak — strongest now. Tight = cold in lungs (chills, white phlegm). Rapid = heat (yellow phlegm, thirst)"
      sound_practice: "Full SSSS exhale — arms overhead, palms face ceiling, stretch open the chest"
      inner_smile: "Feel courage and righteousness replacing grief or sadness. Lungs glow white"
    - phase: Declining
      activity: "Gentle transition — slow walking, mindful breathing"
      improvement: "If grieving: allow tears now, Lung processes letting go"
      pulse_position: "Hold 15+ breaths, feel rhythm changes"
      pulse_description: "Qi declining — pulse softening. If still very strong: Qi not flowing to next organ (stagnation)"
      sound_practice: "Soften the SSSS to a whisper. Lower arms slowly. Feel lungs releasing"
      inner_smile: "Let the warm feeling settle deep into lung tissue. Grief dissolves into the sound"
    - phase: Exiting
      activity: "Prepare for elimination — drink warm water"
      improvement: "Skin reflects Lung health: dry skin = Lung Qi weakness"
      pulse_position: "Compare with LEFT Cun (Heart) — both should be balanced"
      pulse_description: "Qi exiting to Large Intestine. Lung sets the body's rhythm. If absent: severe Qi depletion"
      sound_practice: "Silent SSSS — mouth the shape without sound. Hands return to thighs"
      inner_smile: "Thank your lungs. Feel them clean, bright, ready to hand off to Large Intestine"

  "Large Intestine":
    - phase: Entering
      activity: "Ideal time for bowel movement — don't suppress the urge"
      improvement: "Emotion: stuck grief. Letting go physically = letting go emotionally"
      pulse_position: "RIGHT wrist, Cun (closest to thumb)"
      pulse_description: "Qi arriving from Lung — surface pulse awakening. Healthy: moderate strength, smooth rolling"
      sound_practice: "SSSS — same sound as Lung (paired organ). Sit, hands on lower belly"
      inner_smile: "Bring attention to your abdomen, lower right side. Feel the intestinal space"
    - phase: Rising
      activity: "Drink warm water or lemon water to aid elimination"
      improvement: "Dry brushing the skin supports LI meridian (skin/arm path)"
      pulse_position: "Use index finger, LIGHT touch (Yang organ = surface)"
      pulse_description: "Qi building — pulse gaining definition. Slippery = dampness/food stagnation (bloating, loose stool)"
      sound_practice: "Begin soft SSSS exhale. Hands massage belly clockwise gently"
      inner_smile: "Smile to your intestines. Send warmth downward — imagine releasing and letting go"
    - phase: Peak
      activity: "Body is at peak cleansing — most natural BM timing"
      improvement: "Avoid: cold/raw food now. Constipation = stagnation pattern"
      pulse_position: "Stay at skin level, don't press deep"
      pulse_description: "Qi at peak — strongest now. Choppy/rough = dryness (constipation, cracked lips). Wiry = cramping"
      sound_practice: "Full SSSS — feel the vibration in the lower abdomen, not the chest"
      inner_smile: "Feel clarity replacing holding. The body releases what is no longer needed"
    - phase: Declining
      activity: "Light breakfast after elimination — warm, simple food"
      improvement: "If bloated/gassy: LI damp-heat or food stagnation"
      pulse_position: "Feel for regularity — should be even"
      pulse_description: "Qi declining — pulse easing. Good time to notice if flow feels 'stuck' or rough"
      sound_practice: "Soften SSSS. Hands still on belly, feel warmth spreading"
      inner_smile: "Let the releasing feeling complete. Don't force — allow natural downward movement"
    - phase: Exiting
      activity: "Prepare for Stomach — the body is ready to receive food"
      improvement: "Regularity here = good health indicator. Track your patterns"
      pulse_position: "Compare with deep press (Lung below) — surface should feel livelier"
      pulse_description: "Qi exiting to Stomach. Weak = poor downward movement. Elimination issues show here"
      sound_practice: "Silent SSSS. Hands rest. Feel the belly soft and open"
      inner_smile: "Thank your Large Intestine. Feel clean, empty, ready for Stomach to receive"

  "Stomach":
    - phase: Entering
      activity: "Eat your LARGEST meal now — digestion is strongest"
      improvement: "Emotion: worry about nourishment. Taste: naturally sweet foods"
      pulse_position: "RIGHT wrist, Guan (middle position)"
      pulse_description: "Qi arriving — the 'root' pulse awakening. Healthy: strong, steady. Should ALWAYS be felt"
      sound_practice: "WHOO — (from the throat, like blowing gently). Sit, hands on upper belly"
      inner_smile: "Bring attention to your stomach, center below ribs. Feel the space there"
    - phase: Rising
      activity: "Warm, cooked food preferred — soup, porridge, grains"
      improvement: "Avoid: ice water, raw salads, excessive cold fruit"
      pulse_position: "Use middle finger, pad centered on artery"
      pulse_description: "Qi building — pulse growing firm. Slippery = food retention (fullness, acid reflux)"
      sound_practice: "Begin soft WHOO exhale. Feel vibration in the upper belly area"
      inner_smile: "Smile to your stomach. Send golden-yellow warmth. Imagine a warm hearth"
    - phase: Peak
      activity: "Peak digestive fire — the body extracts maximum nutrition now"
      improvement: "The saying 'eat breakfast like a king' aligns with Stomach peak"
      pulse_position: "LIGHT touch for Stomach (Yang organ = surface)"
      pulse_description: "Qi at peak — most vital pulse. Weak = Stomach Qi deficiency (no appetite, fatigue after meals)"
      sound_practice: "Full WHOO — mouth rounds, sound resonates in the center. Hands press gently"
      inner_smile: "Feel trust and groundedness replacing worry. Stomach glows warm yellow"
    - phase: Declining
      activity: "Stop eating, let digestion work — don't add more food"
      improvement: "Acid reflux or nausea now = Stomach Qi rebellion (going up instead of down)"
      pulse_position: "This is the most important vitality pulse — check it first"
      pulse_description: "Qi declining — still strong. Wiry = epigastric pain, stress affecting digestion"
      sound_practice: "Soften WHOO to a hum. Feel the stomach settling, content"
      inner_smile: "Let nourishing warmth spread from stomach center outward. Worry dissolves"
    - phase: Exiting
      activity: "Prepare for Spleen — food is transforming into Qi"
      improvement: "Stomach health shows in lips: cracked/pale lips = Stomach weakness"
      pulse_position: "Compare with deep press (Spleen below) — together they show digestion"
      pulse_description: "Qi exiting to Spleen. If Stomach pulse disappears: serious sign — seek medical attention"
      sound_practice: "Silent WHOO. Hands rest on upper belly. Feel centered and stable"
      inner_smile: "Thank your stomach. Feel grounded, ready to transform food into Qi for Spleen"

  "Spleen":
    - phase: Entering
      activity: "Best time for thinking, studying, concentration"
      improvement: "Emotion: overthinking/worry. Sense: mouth/taste. Tissue: muscles"
      pulse_position: "RIGHT wrist, Guan (middle position)"
      pulse_description: "Qi arriving from Stomach — deep pulse emerging. Healthy: soft, moderate, like gentle rolling"
      sound_practice: "WHOO — same sound as Stomach (paired organ). Sit, hands on left side below ribs"
      inner_smile: "Bring attention to your spleen, left side. Feel the deep organ space"
    - phase: Rising
      activity: "Intellectual work peaks now — Spleen governs thought"
      improvement: "Light movement aids digestion: walk after breakfast, gentle yoga"
      pulse_position: "Use middle finger, press DEEP (Yin organ)"
      pulse_description: "Qi building — pulse gaining substance. Soggy/soft = dampness (heavy limbs, foggy thinking)"
      sound_practice: "Begin soft WHOO exhale. Focus the vibration deeper than Stomach, to the left"
      inner_smile: "Smile to your spleen. Send deep golden warmth. Imagine rich earth nourishing roots"
    - phase: Peak
      activity: "Peak mental clarity — best for learning, problem solving"
      improvement: "Avoid: worry spirals, sitting too long. Sweet cravings = Spleen calling"
      pulse_position: "Press to muscle level, feel for substance"
      pulse_description: "Qi at peak — fullest now. Weak/empty = Qi sinking (prolapse, bruising easily)"
      sound_practice: "Full WHOO — feel it vibrate the left side. Hands hold the left ribs gently"
      inner_smile: "Feel fairness and trust replacing overthinking. Spleen glows deep golden"
    - phase: Declining
      activity: "Reduce mental intensity — Spleen tires from overthinking"
      improvement: "Dampness signs: foggy head, heavy limbs, bloating = weak Spleen"
      pulse_position: "Hold steady, feel if pulse 'collapses' under pressure"
      pulse_description: "Qi declining — naturally softening. Thin = blood deficiency (pale face, dizziness)"
      sound_practice: "Soften WHOO. Feel the mind becoming quiet and clear"
      inner_smile: "Let the clarity settle. Overthinking dissolves — the mind rests in the body"
    - phase: Exiting
      activity: "Prepare for Heart — mental energy transitions to emotional"
      improvement: "Spleen builds blood: bruising, fatigue, scanty periods = Spleen Qi deficiency"
      pulse_position: "Compare with surface Stomach above — deep should be softer"
      pulse_description: "Qi exiting to Heart. Spleen transforms food into Qi — weak here = root of chronic issues"
      sound_practice: "Silent WHOO. Hands rest. Mind is still, body feels substantial"
      inner_smile: "Thank your spleen. Feel nourished and mentally clear. Prepare for Heart"

  "Heart":
    - phase: Entering
      activity: "Rest if possible — Heart is at peak, don't overstress it"
      improvement: "Emotion: joy (excess = mania/anxiety). Sense: tongue. Tissue: blood vessels"
      pulse_position: "LEFT wrist, Cun (closest to thumb)"
      pulse_description: "Qi arriving from Spleen — pulse awakening. Healthy: smooth, regular, like a calm wave"
      sound_practice: "HAW — (open mouth, like fogging a mirror). Sit, hands at heart center"
      inner_smile: "Bring attention to your heart center. Feel the rhythm, the warmth there"
    - phase: Rising
      activity: "Siesta cultures align with this: a short nap is ideal"
      improvement: "Joyful social connection nourishes Heart — light conversation"
      pulse_position: "Use index finger, press DEEP (Yin organ)"
      pulse_description: "Qi building — pulse gaining warmth. Rapid = Heart fire (anxiety, insomnia, red face)"
      sound_practice: "Begin soft HAW exhale. Hands open outward from heart, palms facing forward"
      inner_smile: "Smile to your heart. Send rose-red light. Feel genuine warmth, not excitement"
    - phase: Peak
      activity: "Heart peak — avoid intense exercise, arguments, shocks"
      improvement: "Bitter taste supports Heart: green tea, dark chocolate (small amount)"
      pulse_position: "Feel for regularity — skipped beats matter here"
      pulse_description: "Qi at peak — strongest now. Irregular/skipping = stagnation (palpitations, chest tightness)"
      sound_practice: "Full HAW — mouth wide open, tongue flat. Sound clears heat from the chest"
      inner_smile: "Feel calm joy and love replacing anxiety or restlessness. Heart glows soft red"
    - phase: Declining
      activity: "Calm activities — gentle walk, reading, pleasant company"
      improvement: "Insomnia often roots here: Heart fire or blood deficiency"
      pulse_position: "Count beats per breath (normal: 4-5 per breath cycle)"
      pulse_description: "Qi declining — pulse calming. Thin/thready = blood deficiency (poor memory, disturbed sleep)"
      sound_practice: "Soften HAW to a gentle breath. Hands return to heart. Feel peace"
      inner_smile: "Let deep calm settle into the heart. Anxiety and excess fire dissolve with the sound"
    - phase: Exiting
      activity: "Prepare for Small Intestine — from feeling to discernment"
      improvement: "Heart shows in complexion: dull/pale face = Heart blood issue"
      pulse_position: "Compare with RIGHT Cun (Lung) — Heart should feel slightly stronger"
      pulse_description: "Qi exiting to Small Intestine. Choppy = blood stasis (serious). Heart houses the mind"
      sound_practice: "Silent HAW. Hands rest at heart. Feel love without agitation"
      inner_smile: "Thank your heart. Feel peaceful, joyful, still. Prepare for Small Intestine"

  "Small Intestine":
